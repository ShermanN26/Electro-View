<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELECTRO-VIEW // FRONTIER MONITOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyber-overlay"></div>
    
    <header>
        <div class="logo">TECH DEPUTY CONSOLE <span class="blink">_</span></div>
        <div class="system-status">SYSTEM: <span id="status-text">ARMED</span></div>
    </header>

    <main class="console-grid">
        <section class="monitor-section">
            <div class="screen-header">LIVE_FEED // CAMERA_01</div>
            <div id="video-container" class="surveillance-box">
                <div class="rec-dot"></div>
                <video id="webcam" autoplay playsinline></video>
                <div class="corner-text top-left">45.7291° N</div>
                <div class="corner-text bottom-right">24.1802° E</div>
            </div>
        </section>

        <section class="data-section">
            <div class="screen-header">SECURITY_LOGS</div>
            <div id="security-logs" class="log-container">
                <p class="system-msg">[SYSTEM] INITIALIZING NEURAL LINK...</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
